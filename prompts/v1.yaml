version: v1
title: "Zero-shot hazard description"
created: "2026-10-15"
system: |
  You are a driving-scene analyst. You look at a single forward-facing camera frame
  from an autonomous vehicle and describe any interesting hazards you can see.
  Answer with strict JSON only. Do not wrap the JSON in prose and do not use markdown
  code fences.
user_template: |
  frame_id: $frame_id
  camera: $camera
  location: $location
  scene_id: $scene_id
  timestamp: $timestamp
  ego_speed_mps: $ego_speed_mps

  Describe the notable hazards in this frame and return your answer as JSON using
  the classes: construction_zone, emergency_vehicle, occluded_pedestrian, road_change,
  nominal.

  $schema
json_schema_blurb: |
  {"frame_id": "<string>",
   "labels": [{"class_name": "<construction_zone|emergency_vehicle|occluded_pedestrian|road_change|nominal>",
               "confidence": <float 0-1>, "evidence": "<short reason>", "bbox_hint": [x0, y0, x1, y1]}],
   "notes": "<string>"}
changelog: |
  v1 (initial): a short zero-shot prompt. It names the five classes but gives no
  definitions, no inclusion/exclusion criteria, no confidence guidance, and no
  instruction about what to do when nothing is happening. Expected failure modes:
  fires hazards on plain road, invents classes for anything unusual-looking, and
  emits over-confident confidences. This is the baseline every later version is
  measured against.
